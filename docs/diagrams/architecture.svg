<text x="808" y="632" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#0f172a">Servidores</text>
<text x="808" y="660" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">Orion NGSIv2 / otros receptores</text>
<text x="808" y="684" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">Deduplicar ID + boot_id + sequence</text>
