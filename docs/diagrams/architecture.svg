<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>TARS · arquitectura 4.1.1</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="1200" height="750" rx="24" fill="#f8fafc"/>
<text x="45" y="52" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#0f172a">TARS · arquitectura 4.1.1</text>
<text x="45" y="84" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">Lectura independiente · ventanas de muestras · cuatro destinos HTTPS · mantenimiento temporal</text>
<rect x="40" y="130" width="280" height="170" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="58" y="162" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#0f172a">Sensores</text>
<text x="58" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">HDC1080 · °C / %</text>
<text x="58" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">B-LUX-V30B · lux</text>
<text x="58" y="238" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">ADC GPIO35 · voltaje</text>
<rect x="380" y="130" width="350" height="170" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
<text x="398" y="162" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#0f172a">Tarea de sensores · core 1</text>
<text x="398" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">Lectura 5 s / ventana 60 s</text>
<text x="398" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">I²C y cambios CPU serializados</text>
<text x="398" y="238" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">OLED y botón; calidad / secuencia</text>
<rect x="790" y="130" width="365" height="170" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="808" y="162" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#0f172a">OLED + botón</text>
<text x="808" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">Clic: despertar / página</text>
<text x="808" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">4 s: mantenimiento normal</text>
<text x="808" y="238" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">10 s: AP de recuperación</text>
