<path d="M730 210 L790 210" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="370" width="280" height="165" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="58" y="402" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#0f172a">Configuración · NVS</text>
<text x="58" y="430" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">WiFi / identidad / calibración</text>
<text x="58" y="454" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">URLs y credenciales privadas</text>
<text x="58" y="478" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">Validación y prueba de red</text>
<rect x="380" y="370" width="350" height="165" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="398" y="402" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#0f172a">Colas · SPIFFS</text>
<text x="398" y="430" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">Máximo 32 registros / destino</text>
<text x="398" y="454" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">Persistir antes del envío</text>
<text x="398" y="478" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">Borrar solo tras HTTP 2xx</text>
<rect x="790" y="370" width="365" height="165" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="808" y="402" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#0f172a">Tarea de red · core 0</text>
<text x="808" y="430" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">TLS verificado + UTC</text>
<text x="808" y="454" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">Reintentos independientes</text>
<text x="808" y="478" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">Control HMAC V2 / OTA AMERI1</text>
