<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img"><title>TARS · botón y recuperación</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="1200" height="550" rx="24" fill="#f8fafc"/>
<text x="45" y="52" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#0f172a">TARS · botón y recuperación</text>
<text x="45" y="84" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">Sin pantalla, sin servidor y sin puerto serie · el AP no se abre automáticamente al arrancar</text>
<rect x="40" y="140" width="330" height="165" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="58" y="172" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#0f172a">Clic corto</text>
<text x="58" y="200" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">Pantalla apagada → despertar</text>
<text x="58" y="224" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">Pantalla encendida → página</text>
<text x="58" y="248" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">No abre mantenimiento</text>
<rect x="435" y="140" width="330" height="165" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
<text x="453" y="172" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#0f172a">Mantener 4 segundos</text>
<text x="453" y="200" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">WiFi conectada → panel STA</text>
<text x="453" y="224" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">Sin conexión → AP temporal</text>
<text x="453" y="248" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">Plazo: 10 minutos</text>
<rect x="830" y="140" width="330" height="165" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="848" y="172" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#0f172a">Continuar hasta 10 s</text>
<text x="848" y="200" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">Fuerza AP incluso con WiFi</text>
<text x="848" y="224" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">STA sigue conectada</text>
<text x="848" y="248" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">Nuevo plazo: 10 minutos</text>
<path d="M765 220 L830 220" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="365" width="1120" height="120" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
<text x="58" y="397" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#0f172a">Acceso al AP</text>
<text x="58" y="425" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">Red TARS-{ID} o TARS-NEW-{sufijo MAC} · http://192.168.4.1</text>
<text x="58" y="449" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">Clave inicial tars12345678 · panel admin / misma clave · al vencer: panel y AP cerrados</text></svg>